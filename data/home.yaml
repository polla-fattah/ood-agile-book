faq:
  title: Frequently Asked Questions
  items:
  - question: Who is this textbook intended for?
    answer: It is written for postgraduate students in Artificial Intelligence (SE506 at UKH) and software engineers looking to master production-quality object-oriented design, automated testing, and agile collaboration.
    open: true
  - question: Why focus on software engineering for AI students?
    answer: The course descriptor prepares students to build reliable, maintainable software *around* AI and data components, handling real-world fallbacks, timeouts, test doubles, and evolving domain rules.
  - question: What is the Campus Equipment Lending System?
    answer: A realistic running domain used across chapters. Starting from a single reservation rule, it grows iteratively into a layered, decoupled system with persistence and policy models.
  - question: How are code companions structured?
    answer: Each chapter is paired with a companion containing complete or delta Java listings, line-by-line walkthroughs, lab solutions, and verified test outputs.
  - question: Can I read and build the materials offline?
    answer: Yes. Every chapter companion includes self-contained code listings, and all dependencies are pinned for reproducible offline testing.
principles:
  title: Foundational engineering principles
  columns: 3
  items:
  - icon: fa-solid fa-code-branch
    title: Design for change
    desc: Invert dependencies, protect invariants, and isolate components that change for different reasons.
  - icon: fa-solid fa-check-double
    title: Test as a design practice
    desc: Write automated tests to discover cohesive interfaces, define contracts, and prevent regressions.
  - icon: fa-solid fa-arrows-spin
    title: Iterate with empirical feedback
    desc: Make small, reversible commits, measure flow with lead and cycle times, and adapt plans continuously.
