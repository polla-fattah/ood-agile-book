steps:
  title: The change-driven teaching method
  items:
  - title: 1. Understand the change
    desc: Read the scenario and distinguish existing guarantees from new business requirements.
  - title: 2. Choose the OO design
    desc: Justify structural choices using SOLID principles, encapsulation, and composition over inheritance.
  - title: 3. Test as design practice
    desc: Drive implementation with characterisation and unit tests using Arrange-Act-Assert.
  - title: 4. Inspect, refactor & evolve
    desc: Apply safe refactorings, monitor lead/cycle time, and integrate feedback continuously.
